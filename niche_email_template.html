<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Niche Email</title>
<style>
  body {background-color: #f4f4f4; margin: 0; padding: 0;}
  .container {background-color: #ffffff; max-width: 600px; margin: 20px auto; padding: 20px; font-family: Arial, sans-serif;}
  h1 {color: #333333;}
  p {line-height: 1.4;}
  .footer {font-size: 12px; color: #777777; text-align: center; margin-top: 20px;}
</style>
</head>
<body>
  <div class="container">
    <h1>{{nicheName}}</h1>
    <p>{{description}}</p>
    {{#if imageUrl}}
    <p><img src="{{imageUrl}}" alt="{{nicheName}}" style="max-width:100%;"></p>
    {{/if}}
    <p>Best regards,<br>Example Company</p>
    <div class="footer">You are receiving this email because you subscribed to our niche updates.</div>
  </div>
</body>
</html>
